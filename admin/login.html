<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Jhunjhur</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f0e8;
            padding: 20px;
        }
        .login-box {
            background: #fffdf8;
            padding: 45px 40px 40px;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(23, 60, 53, 0.15);
            border: 1px solid rgba(168, 117, 37, 0.08);
            max-width: 420px;
            width: 100%;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
        .login-logo h1 {
            font-family: 'Allura', cursive;
            font-size: 2.5rem;
            color: #173c35;
        }
        .login-logo small {
            display: block;
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: #a87525;
        }
        .login-title {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-title h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: #173c35;
        }
        .login-title p {
            font-size: 0.7rem;
            color: #70695d;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.6rem;
            font-weight: 600;
            color: #173c35;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 16px;
            border: 1px solid rgba(168, 117, 37, 0.2);
            border-radius: 8px;
            font-size: 0.8rem;
            color: #173c35;
            background: #fcf8f0;
            transition: border-color 0.25s ease;
        }
        .form-group input:focus {
            border-color: #a87525;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            background: #173c35;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #a87525;
            transform: translateY(-2px);
        }
        .login-error {
            background: rgba(231, 76, 60, 0.08);
            color: #e74c3c;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.7rem;
            margin-bottom: 15px;
            display: none;
            border-left: 3px solid #e74c3c;
        }
        .login-error.show {
            display: block;
        }
        .demo-credentials {
            background: rgba(168, 117, 37, 0.06);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.65rem;
            color: #70695d;
            border: 1px dashed rgba(168, 117, 37, 0.15);
            text-align: center;
        }
        .demo-credentials strong {
            color: #173c35;
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-box">
        
        <div class="login-logo">
            <img src="../assets/jhunjhur-logo.png" alt="Jhunjhur">
            <h1>Jhunjhur</h1>
            <small>Admin Panel</small>
        </div>
        
        <div class="login-title">
            <h2>👋 Admin Access</h2>
            <p>Sign in to manage your store</p>
        </div>
        
        <div class="login-error" id="loginError">
            <i class="fa-solid fa-circle-exclamation"></i>
            Invalid email or password
        </div>
        
        <div class="demo-credentials">
            <strong>🔑 Demo:</strong> 
            Email: <strong>admin@jhunjhur.com</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="adminEmail" placeholder="admin@jhunjhur.com" value="admin@jhunjhur.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" value="admin123">
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
        
        <div style="text-align:center; margin-top:15px; font-size:0.6rem; color:#b0a694;">
            <a href="../index.html" style="color:#a87525; text-decoration:none;">← Back to Website</a>
        </div>
        
    </div>
</div>

<script>
// =========================================================
// ADMIN LOGIN - LOCALSTORAGE VERSION (No API)
// =========================================================

document.getElementById('loginForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value.trim();
    const error = document.getElementById('loginError');
    
    if (!email || !password) {
        error.textContent = 'Please fill in all fields';
        error.classList.add('show');
        return;
    }
    
    // Check admin credentials (localStorage)
    if (email === 'admin@jhunjhur.com' && password === 'admin123') {
        const admin = { 
            id: 'admin_001', 
            email: email, 
            name: 'Admin',
            role: 'super_admin',
            loginTime: new Date().toISOString()
        };
        
        // Save admin user to localStorage
        localStorage.setItem('adminUser', JSON.stringify(admin));
        
        // Show success and redirect
        alert('✅ Login successful! Redirecting to dashboard...');
        window.location.href = 'dashboard.html';
    } else {
        error.textContent = 'Invalid email or password. Use admin@jhunjhur.com / admin123';
        error.classList.add('show');
    }
});
</script>

</body>
</html>
